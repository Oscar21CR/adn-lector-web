<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADN Lector</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Manrope',sans-serif;
      background:#FBF6EC;color:#241C14;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
    }
    .box{text-align:center;max-width:480px;padding:40px 28px;}
    .dna{font-size:44px;margin-bottom:24px;}
    h1{
      font-family:'Fraunces',serif;font-style:italic;font-weight:500;
      font-size:clamp(32px,8vw,48px);line-height:1.1;margin-bottom:18px;
      background:linear-gradient(100deg,#8C4A6B,#D96B43 55%,#C98A2E);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    p{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.06em;
      text-transform:uppercase;color:#8C7E68;line-height:1.6;}
  </style>
</head>
<body>
  <div class="box">
    <div class="dna">🧬</div>
    <h1>ADN Lector</h1>
    <p>Cada perfil vive en su propia URL.<br>Si recibiste un link, abrilo directamente.</p>
  </div>
</body>
</html>
